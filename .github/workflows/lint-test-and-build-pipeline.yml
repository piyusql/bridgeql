name: bridgeql-lint-test-and-build

on: [push, pull_request]

jobs:
  lint-test-build:
    name: lint, test and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Check PEP8 compliance
        run: pip install autopep8 && autopep8 --in-place --exclude=venv,.tox -r .

      - name: Run tests via tox
        run: pip install tox && tox

      - name: Build distribution package
        run: python -m pip install --upgrade build && python -m build
